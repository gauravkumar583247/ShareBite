<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareBite - Food Sharing</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('feed')">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-lg font-bold shadow-sm">
          🍲
        </div>
        <span class="text-xl font-black text-slate-900 tracking-tight">Share<span class="text-emerald-600">Bite</span></span>
      </div>

      <!-- Navigation & Action -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="navFeedBtn" onclick="switchTab('feed')" class="px-3 py-1.5 rounded-lg text-sm font-bold text-emerald-700 bg-emerald-50">
          Food
        </button>
        <button id="navClaimsBtn" onclick="switchTab('claims')" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center gap-1.5">
          <span>My Pickups</span>
          <span id="userClaimsBadge" class="hidden bg-emerald-600 text-white text-xs px-1.5 py-0.2 rounded-full font-bold">0</span>
        </button>
        <button onclick="openAddFoodModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-plus"></i>
          <span>Add Food</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-5 flex-1 w-full">

    <!-- FEED VIEW -->
    <div id="viewFeed" class="space-y-4">
      
      <!-- Search & Filters -->
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search food, mess, or restaurant..."
            class="w-full pl-9 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm"
            oninput="handleSearch(this.value)"
          >
        </div>

        <!-- Filter Buttons -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs font-semibold">
          <button onclick="setFilter('all')" data-filter="all" class="filter-btn active-filter px-3 py-2 rounded-xl bg-emerald-600 text-white whitespace-nowrap">
            All
          </button>
          <button onclick="setFilter('free')" data-filter="free" class="filter-btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-emerald-700 whitespace-nowrap">
            Free (₹0)
          </button>
          <button onclick="setFilter('low-price')" data-filter="low-price" class="filter-btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-orange-700 whitespace-nowrap">
            Low Price
          </button>
          <button onclick="setFilter('veg')" data-filter="veg" class="filter-btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 whitespace-nowrap">
            Veg
          </button>
          <button onclick="setFilter('non-veg')" data-filter="non-veg" class="filter-btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 whitespace-nowrap">
            Non-Veg
          </button>
        </div>
      </div>

      <!-- Food Cards Grid -->
      <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pt-1">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-4">
        <p class="font-bold text-slate-700 text-sm">No food found</p>
        <button onclick="openAddFoodModal()" class="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">
          + Add Food Now
        </button>
      </div>

    </div>

    <!-- MY PICKUPS VIEW -->
    <div id="viewClaims" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">My Pickups & Token Passes</h2>
        <button onclick="switchTab('feed')" class="text-xs text-emerald-700 font-bold hover:underline">
          Back to Food
        </button>
      </div>

      <div id="claimedList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Injected via JS -->
      </div>

      <div id="claimedEmpty" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-200 p-4">
        <p class="text-slate-600 text-sm font-medium">You haven't claimed any food yet.</p>
        <button onclick="switchTab('feed')" class="mt-3 px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">
          Browse Food
        </button>
      </div>
    </div>

  </main>

  <!-- MODAL: ADD FOOD (SIMPLE FORM WITH FILE UPLOAD FROM PC) -->
  <div id="addFoodModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-xl overflow-hidden border border-slate-200 max-h-[90vh] flex flex-col">
      
      <!-- Modal Header -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-900 text-base">Add Remaining Food</h3>
        <button onclick="closeAddFoodModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs">
          ✕
        </button>
      </div>

      <!-- Form Body -->
      <form id="addFoodForm" onsubmit="handleFoodFormSubmit(event)" class="p-4 overflow-y-auto space-y-3.5 text-xs">
        
        <!-- 1. Food Name -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Food Name *</label>
          <input 
            type="text" 
            id="formTitle" 
            required 
            placeholder="e.g. Dinner Thali, Biryani, Roti & Sabzi"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          >
        </div>

        <!-- 2. Mess / Restaurant Name -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Mess / Restaurant Name *</label>
          <input 
            type="text" 
            id="formProvider" 
            required 
            placeholder="e.g. Hostel 3 Mess, Spice Restaurant"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          >
        </div>

        <!-- 3. Category & Quantity -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Type *</label>
            <select id="formCategory" class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs bg-white focus:outline-none">
              <option value="veg">🟢 Pure Veg</option>
              <option value="non-veg">🔴 Non-Veg</option>
              <option value="bakery">🥐 Bakery / Snacks</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Plates / Portions *</label>
            <input 
              type="number" 
              id="formQuantity" 
              min="1" 
              max="500" 
              value="5" 
              required 
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold focus:outline-none"
            >
          </div>
        </div>

        <!-- 4. Price Setting -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Price *</label>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <button 
              type="button" 
              id="btnPriceFree" 
              onclick="selectPriceMode('free')"
              class="py-2 px-3 rounded-xl font-bold border-2 border-emerald-600 bg-emerald-50 text-emerald-800 text-center"
            >
              FREE (₹0)
            </button>
            <button 
              type="button" 
              id="btnPriceLow" 
              onclick="selectPriceMode('low')"
              class="py-2 px-3 rounded-xl font-bold border border-slate-200 bg-white text-slate-700 text-center hover:bg-slate-50"
            >
              Low Price (₹)
            </button>
          </div>

          <div id="lowPriceInputWrap" class="hidden">
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold">₹</span>
              <input 
                type="number" 
                id="formPriceValue" 
                min="1" 
                placeholder="Enter price per plate (e.g. 20)" 
                class="w-full pl-7 pr-3 py-2 rounded-xl border border-slate-300 text-sm font-bold"
              >
            </div>
          </div>
        </div>

        <!-- 5. Upload Photo from PC -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Upload Photo from PC (Optional)</label>
          <input 
            type="file" 
            id="formPhotoFile" 
            accept="image/*"
            onchange="handlePhotoUpload(event)"
            class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-xl p-1"
          >
          <!-- Preview of uploaded PC image -->
          <div id="photoPreviewBox" class="hidden mt-2 relative w-20 h-20 rounded-xl overflow-hidden border border-slate-200">
            <img id="photoPreviewImg" src="" alt="Preview" class="w-full h-full object-cover">
            <button type="button" onclick="clearUploadedPhoto()" class="absolute top-1 right-1 bg-black/70 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
              ✕
            </button>
          </div>
        </div>

        <!-- 6. Pickup Location & Phone -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Pickup Location *</label>
            <input 
              type="text" 
              id="formLocation" 
              required 
              placeholder="e.g. Mess Counter, Gate 2"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none"
            >
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Phone Number *</label>
            <input 
              type="tel" 
              id="formPhone" 
              required 
              placeholder="e.g. 9876543210"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md transition"
          >
            Add Food
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- MODAL: BUY / CLAIM FOOD (1-CLICK SIMPLE) -->
  <div id="claimModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-2xl max-w-sm w-full shadow-xl overflow-hidden border border-slate-200">
      
      <!-- Header -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-900 text-sm">Claim Food</h3>
        <button onclick="closeClaimModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs">
          ✕
        </button>
      </div>

      <!-- Item Preview -->
      <div class="p-4 bg-slate-50 border-b border-slate-100 flex items-center gap-3">
        <img id="claimImg" src="" alt="" class="w-14 h-14 rounded-xl object-cover bg-slate-200">
        <div>
          <h4 id="claimTitle" class="font-bold text-slate-900 text-sm"></h4>
          <p id="claimProvider" class="text-xs text-slate-500"></p>
          <span id="claimPriceTag" class="text-xs font-bold text-emerald-700"></span>
        </div>
      </div>

      <!-- Form -->
      <form id="claimForm" onsubmit="handleClaimSubmit(event)" class="p-4 space-y-3 text-xs">
        
        <div>
          <label class="block font-bold text-slate-700 mb-1">Number of Portions</label>
          <div class="flex items-center gap-2">
            <button type="button" onclick="changeClaimQty(-1)" class="w-9 h-9 rounded-lg bg-slate-100 font-bold text-base hover:bg-slate-200">-</button>
            <span id="claimQtyText" class="flex-1 text-center font-black text-lg text-slate-800">1</span>
            <button type="button" onclick="changeClaimQty(1)" class="w-9 h-9 rounded-lg bg-slate-100 font-bold text-base hover:bg-slate-200">+</button>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Your Name *</label>
          <input 
            type="text" 
            id="claimBuyerName" 
            required 
            placeholder="e.g. Rahul"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none"
          >
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Your Mobile Number *</label>
          <input 
            type="tel" 
            id="claimBuyerPhone" 
            required 
            placeholder="e.g. 9876543210"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none"
          >
        </div>

        <div class="p-2.5 bg-emerald-50 rounded-xl flex items-center justify-between font-bold">
          <span class="text-emerald-900">Total Price:</span>
          <span id="claimTotalCost" class="text-emerald-700 text-sm">FREE</span>
        </div>

        <button 
          type="submit" 
          class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition"
        >
          Confirm & Get Token
        </button>

      </form>

    </div>
  </div>

  <!-- MODAL: PICKUP TOKEN / PASS -->
  <div id="tokenModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl overflow-hidden border border-slate-200">
      
      <div class="bg-emerald-600 text-white p-4 text-center">
        <h3 class="font-extrabold text-base">Pickup Token</h3>
        <p class="text-xs text-emerald-100">Show this at the mess counter</p>
      </div>

      <div class="p-5 text-center space-y-3 text-xs">
        
        <div class="p-3 bg-slate-100 rounded-xl font-mono text-xl font-black text-slate-900 tracking-wider" id="passCode">
          SB-1234
        </div>

        <div class="flex justify-center py-1">
          <div id="passQr" class="p-2 bg-white border border-slate-200 rounded-xl"></div>
        </div>

        <div class="text-left bg-slate-50 p-3 rounded-xl space-y-1 text-slate-700">
          <div><strong>Food:</strong> <span id="passTitle"></span></div>
          <div><strong>Portions:</strong> <span id="passQty"></span></div>
          <div><strong>Total:</strong> <span id="passPrice" class="font-bold text-emerald-700"></span></div>
          <div><strong>Mess/Restaurant:</strong> <span id="passProvider"></span></div>
          <div><strong>Location:</strong> <span id="passLoc"></span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <a id="passCallLink" href="tel:" class="py-2 bg-slate-100 text-slate-800 rounded-xl font-bold text-center">
            📞 Call
          </a>
          <button onclick="closeTokenModal(); switchTab('claims')" class="py-2 bg-emerald-600 text-white rounded-xl font-bold">
            Done
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-20 opacity-0 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold transition-all duration-300">
    <span id="toastMsg">Saved</span>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
